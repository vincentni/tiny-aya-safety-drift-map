[project]
name = "driftmap"
version = "0.1.0"
description = "Multilingual safety-drift map and repair for Tiny Aya Global (Lexsi hackathon 2026)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "huggingface_hub==2.4.0",
    "httpx2==2.16.0",
    "typer==0.27.3",
    "pydantic==2.14.2",
    "tenacity==9.2.1",
    "scipy==1.18.1",
    "tokenizers==0.23.3",
    "safetensors==0.8.0",
    "auditkit==1.1.3",
]

[project.optional-dependencies]
# no torch here: the job image ships its own
jobs = [
    "transformers==5.22.1",
    "peft==0.21.2",
    "trl==1.14.2",
    "safetune==0.1.10",
    "curatorkit==0.1.22",
    "datasets==5.1.0",
    "accelerate==1.15.0",
]
# the closed-model judge runs on a workstation through any LiteLLM route
closed = [
    "litellm==1.103.11",
]
# the figures are drawn on a workstation from the stored tables
figures = [
    "matplotlib==3.11.2",
]
# romanization for the script stress sets; read on a workstation by the data build, never in a job
variants = [
    "indic-transliteration==2.3.82",
    "iuliia==0.13.0",
]

[project.scripts]
driftmap = "driftmap.cli:app"

[dependency-groups]
dev = [
    "driftmap[jobs]",
    "driftmap[closed]",
    "driftmap[figures]",
    "driftmap[variants]",
    "torch==2.15.0",
    "pytest==9.2.0",
    "pytest-socket==0.8.1",
    "hypothesis==6.170.14",
    "nbclient==0.11.0",
    "nbformat==5.11.1",
    "pytest-timeout==2.4.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = "--disable-socket --timeout=120 --import-mode=importlib"
markers = ["smoke: needs network and real job records; never submits a job"]
testpaths = ["tests"]
